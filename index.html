<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Be My Valentine? 💘</title>
    <meta name="theme-color" content="#ff6fb1" />
    <style>
      :root {
        --pink-1: #ffe1ef;
        --pink-2: #ffb6d5;
        --pink-3: #ff6fb1;
        --pink-4: #ff3f95;
        --ink: #4a2140;
        --card: #ffffffcc;
        --shadow: 0 18px 60px rgba(255, 63, 149, 0.25);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family:
          ui-rounded,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          "Helvetica Neue",
          Arial,
          "Apple Color Emoji",
          "Segoe UI Emoji";
        color: var(--ink);
        overflow-x: hidden;
        background:
          radial-gradient(1200px 800px at 20% 20%, #fff 0%, transparent 55%),
          radial-gradient(900px 700px at 80% 35%, #fff 0%, transparent 60%),
          linear-gradient(135deg, var(--pink-1), #ffd7ea 35%, var(--pink-2));
      }

      /* floating hearts background */
      .hearts {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .heart {
        position: absolute;
        font-size: clamp(14px, 2.2vw, 26px);
        opacity: 0.35;
        filter: blur(0.2px);
        animation: floatUp linear infinite;
        transform: translateY(110vh);
      }
      @keyframes floatUp {
        from {
          transform: translateY(110vh) rotate(0deg);
        }
        to {
          transform: translateY(-20vh) rotate(360deg);
        }
      }

      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 28px 16px;
        position: relative;
        z-index: 1;
      }

      .card {
        width: min(680px, 94vw);
        background: var(--card);
        border: 1px solid rgba(255, 111, 177, 0.25);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        padding: 26px 22px 22px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      /* soft peony-ish blobs */
      .petal {
        position: absolute;
        width: 220px;
        height: 220px;
        background: radial-gradient(
          circle at 30% 30%,
          #fff 0%,
          #ffd1e6 25%,
          #ff9fca 55%,
          transparent 70%
        );
        opacity: 0.55;
        filter: blur(0.6px);
        border-radius: 55% 45% 60% 40% / 55% 45% 55% 45%;
        transform: rotate(18deg);
      }
      .petal.p1 {
        top: -90px;
        left: -70px;
      }
      .petal.p2 {
        bottom: -110px;
        right: -80px;
        transform: rotate(-22deg);
      }

      h1 {
        margin: 6px 0 8px;
        font-size: clamp(30px, 4.6vw, 46px);
        line-height: 1.05;
        letter-spacing: -0.5px;
      }

      .sub {
        margin: 0 auto 16px;
        max-width: 46ch;
        font-size: clamp(14px, 2.1vw, 18px);
        opacity: 0.9;
      }

      .peonyRow {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 6px 0 18px;
        font-size: 24px;
        user-select: none;
      }

      .btnRow {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      button {
        border: 0;
        cursor: pointer;
        padding: 14px 18px;
        border-radius: 999px;
        font-weight: 800;
        letter-spacing: 0.2px;
        font-size: 16px;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          filter 0.18s ease;
        box-shadow: 0 10px 24px rgba(255, 63, 149, 0.2);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        user-select: none;
        touch-action: manipulation;
      }

      #yesBtn {
        background: linear-gradient(135deg, var(--pink-3), var(--pink-4));
        color: white;
        transform: scale(1);
      }
      #yesBtn:active {
        transform: scale(0.98);
      }

      #noBtn {
        background: #fff;
        color: var(--ink);
        border: 1px solid rgba(255, 63, 149, 0.35);
      }

      .note {
        margin-top: 14px;
        font-size: 13px;
        opacity: 0.7;
      }

      /* result area */
      .result {
        margin-top: 18px;
        display: none;
        animation: pop 0.35s ease-out;
      }
      @keyframes pop {
        from {
          transform: translateY(8px) scale(0.98);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .gifBox {
        margin: 14px auto 0;
        width: min(420px, 92%);
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid rgba(255, 111, 177, 0.35);
        box-shadow: 0 16px 46px rgba(255, 63, 149, 0.22);
        background: white;
      }
      .gifBox img {
        display: block;
        width: 100%;
        height: auto;
      }

      .badge {
        display: inline-block;
        background: rgba(255, 111, 177, 0.16);
        border: 1px dashed rgba(255, 111, 177, 0.35);
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: 700;
        margin-top: 10px;
      }

      /* tiny sparkle text */
      .sparkle {
        background: linear-gradient(90deg, #ff3f95, #ff9fca, #ff3f95);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    </style>
  </head>

  <body>
    <div class="hearts" aria-hidden="true" id="hearts"></div>

    <main class="wrap">
      <section class="card" role="group" aria-label="Valentine card">
        <div class="petal p1" aria-hidden="true"></div>
        <div class="petal p2" aria-hidden="true"></div>

        <div class="peonyRow" aria-hidden="true">🌸🌸🌸</div>
        <h1>
          Sheetal, will you be my <span class="sparkle">Valentine</span>? 💘
        </h1>
        <p class="sub">
          I brought the pink, the peonies, and my biggest smile. All that’s
          missing is a “yes” from you 🥺👉👈
        </p>

        <div class="btnRow">
          <button id="yesBtn" type="button" aria-label="Yes">Yes! 💖</button>

          <button id="noBtn" type="button" aria-label="No">No 😶</button>
        </div>

        <div class="note" id="note">
          P.S. “No” is… suspiciously hard to choose 😌
        </div>

        <div class="result" id="result">
          <div class="badge">YAY!!! I knew it 🥰🌸</div>
          <h2 style="margin: 12px 0 6px">Happy Valentine’s, my love 💞</h2>
          <p style="margin: 0; opacity: 0.9">
            Now you’re officially my favorite person forever.
          </p>

          <!-- Replace the GIF URL below with any cute gif you like -->
          <div class="gifBox">
            <img
              id="yesGif"
              alt="Cute celebration gif"
              src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif"
            />
          </div>
        </div>
      </section>
    </main>

    <script>
      // --- Floating hearts background ---
      const heartsEl = document.getElementById("hearts");
      const heartChars = ["💗", "💖", "💘", "💕", "🌸"];
      const HEART_COUNT = 26;

      for (let i = 0; i < HEART_COUNT; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent =
          heartChars[Math.floor(Math.random() * heartChars.length)];
        h.style.left = Math.random() * 100 + "vw";
        h.style.animationDuration = 8 + Math.random() * 10 + "s";
        h.style.animationDelay = -Math.random() * 10 + "s";
        h.style.opacity = (0.18 + Math.random() * 0.35).toFixed(2);
        heartsEl.appendChild(h);
      }

      // --- Yes/No behavior ---
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const result = document.getElementById("result");
      const note = document.getElementById("note");

      let yesScale = 1;

      const noMessages = [
        "Are you suuure? 🥺",
        "That button seems… wrong 👀",
        "Try again 😇",
        "I’ll wait 💗",
        "Your finger slipped, right? 🌸",
        "Ok but… pretty please? 🩷",
        "Plot twist: you meant YES 💘",
      ];

      function setYesScale(scale) {
        yesBtn.style.transform = `scale(${scale})`;
        yesBtn.style.boxShadow = `0 14px 40px rgba(255, 63, 149, ${Math.min(0.55, 0.2 + scale / 10)})`;
      }

      function moveNoButton() {
        // fun little dodge: move "No" to a new random spot within the card
        const card = document.querySelector(".card");
        const rect = card.getBoundingClientRect();
        const btnRect = noBtn.getBoundingClientRect();

        const padding = 16;
        const maxX = rect.width - btnRect.width - padding;
        const maxY = rect.height - btnRect.height - padding;

        // Keep it mostly in the bottom half so it doesn't cover the title
        const x = padding + Math.random() * maxX;
        const y =
          rect.height * 0.52 + Math.random() * (maxY - rect.height * 0.52);

        noBtn.style.position = "absolute";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
      }

      noBtn.addEventListener("click", () => {
        yesScale += 0.25; // grows each time she tries "No"
        setYesScale(yesScale);

        note.textContent =
          noMessages[Math.floor(Math.random() * noMessages.length)];

        // Optional: make "No" dodge after a few clicks
        if (yesScale >= 1.5) moveNoButton();

        // Keep Yes visible and increasingly irresistible
        yesBtn.focus({ preventScroll: true });
      });

      yesBtn.addEventListener("click", () => {
        result.style.display = "block";
        note.textContent = "Best. Decision. Ever. 💞";
        yesBtn.disabled = true;
        noBtn.disabled = true;

        // gentle celebration: add a few extra hearts
        for (let i = 0; i < 10; i++) {
          const h = document.createElement("div");
          h.className = "heart";
          h.textContent =
            heartChars[Math.floor(Math.random() * heartChars.length)];
          h.style.left = Math.random() * 100 + "vw";
          h.style.animationDuration = 6 + Math.random() * 6 + "s";
          h.style.animationDelay = "0s";
          h.style.opacity = (0.35 + Math.random() * 0.35).toFixed(2);
          heartsEl.appendChild(h);
        }

        // scroll result into view on small screens
        result.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    </script>
  </body>
</html>
